<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#13112a;--panel:#1c1a3a;--ink:#ece9ff;--mute:#9a96c4;--line:#37336b;--a:#7aa2ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Sora,system-ui,sans-serif;min-height:100vh;padding:40px 20px 64px}
main{max-width:860px;margin:0 auto}
h1,h2{font-family:Unbounded,Sora,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05}
.sub{color:var(--mute);margin:.8rem 0 2rem;max-width:40ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:22px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--a);border-radius:14px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--a);transform:translateY(-3px)}
.tile:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.tile .ico{font-size:2rem;line-height:1}
.tile h2{font-size:1.15rem;margin:.9rem 0 .25rem}
.tile p{margin:0;color:var(--mute);font-size:.92rem}
#stage{display:none}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:1.4rem}
.btn{cursor:pointer;font:600 .9rem Sora,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--a);background:rgba(255,255,255,.05)}
#score{margin-left:auto;color:var(--mute);font-size:.92rem}
#play{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.hint{margin:12px 0 0;font-size:.85rem;color:var(--mute);text-align:center}
canvas{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);touch-action:none;background:#100e24}
.dpad{display:grid;grid-template-columns:repeat(3,52px);gap:6px}
.dpad .btn{padding:8px 0}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.board{display:grid;gap:10px;touch-action:none}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:#13112a;font:600 2.2rem Unbounded,sans-serif;color:var(--ink);user-select:none;aspect-ratio:1}
.mem{grid-template-columns:repeat(4,minmax(0,84px))}
.mem .cell{font-size:2rem}
.mem .cell.up{background:#ffcf5c;color:#13112a;border-color:#ffcf5c}
.mem .cell.ok{background:#4ff0b0;color:#13112a;border-color:#4ff0b0}
.ttt{grid-template-columns:repeat(3,minmax(0,96px))}
.ttt .cell:disabled{cursor:default}
.ttt .x{color:#7aa2ff}.ttt .o{color:#ff6fb1}
.g2048{grid-template-columns:repeat(4,minmax(0,84px));padding:10px;background:#13112a;border:1px solid var(--line);border-radius:14px}
.g2048 .cell{cursor:default;font-size:1.4rem;color:#13112a;background:#24214a;border-color:transparent}
@media(prefers-reduced-motion:reduce){.tile,.btn{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<main>
  <section id="hub">
    <h1>Pocket Arcade</h1>
    <p class="sub">Four quick games. No sign-up, no downloads. Pick one and play.</p>
    <div class="grid" id="grid"></div>
  </section>
  <section id="stage">
    <div class="bar">
      <button class="btn" id="back">Back to games</button>
      <h2 id="gname"></h2>
      <span id="score"></span>
    </div>
    <div id="play"></div>
    <p class="hint" id="ghint"></p>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const swipe = (node, fn) => {
  let sx, sy;
  node.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  node.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    Math.abs(dx) > Math.abs(dy) ? fn(dx > 0 ? 'r' : 'l') : fn(dy > 0 ? 'd' : 'u');
  });
};

/* ---------- Snake ---------- */
function snake(root, set) {
  const N = 18, C = 20, cv = el('canvas'); cv.width = cv.height = N * C; root.append(cv);
  const ctx = cv.getContext('2d'), V = {u:[0,-1], d:[0,1], l:[-1,0], r:[1,0]};
  let s, d, nd, f, sc, dead, best = +store.get('best-snake') || 0;
  const placeFood = () => { do f = {x: Math.random()*N|0, y: Math.random()*N|0}; while (s.some(p => p.x === f.x && p.y === f.y)); };
  const reset = () => { s = [{x:9,y:9},{x:8,y:9},{x:7,y:9}]; d = nd = V.r; sc = 0; dead = false; placeFood(); set('Score 0 · Best ' + best); draw(); };
  const turn = k => { const v = V[k]; if (v && (v[0] !== -d[0] || v[1] !== -d[1])) nd = v; };
  function draw() {
    ctx.fillStyle = '#100e24'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ff6fb1'; ctx.beginPath(); ctx.arc(f.x*C + C/2, f.y*C + C/2, C/2 - 2, 0, 7); ctx.fill();
    s.forEach((p, i) => { ctx.fillStyle = i ? '#4ff0b0' : '#ecfff8'; ctx.fillRect(p.x*C + 1, p.y*C + 1, C - 2, C - 2); });
  }
  function step() {
    if (dead) return;
    d = nd;
    const h = {x: s[0].x + d[0], y: s[0].y + d[1]};
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || s.some(p => p.x === h.x && p.y === h.y)) {
      dead = true;
      if (sc > best) { best = sc; store.set('best-snake', best); }
      set('Game over: ' + sc + '. Press space or tap the board to restart.');
      return;
    }
    s.unshift(h);
    if (h.x === f.x && h.y === f.y) { sc++; placeFood(); set('Score ' + sc + ' · Best ' + Math.max(best, sc)); } else s.pop();
    draw();
  }
  const keys = {ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r', w:'u', s:'d', a:'l', d:'r'};
  const onKey = e => {
    if (e.key === ' ' && dead) { reset(); e.preventDefault(); return; }
    if (keys[e.key]) { turn(keys[e.key]); e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  cv.addEventListener('click', () => { if (dead) reset(); });
  swipe(cv, turn);
  const pad = el('div', 'dpad');
  [['u','▲'],['l','◀'],['d','▼'],['r','▶']].forEach(([k, t]) => {
    const b = el('button', 'btn ' + k, t); b.setAttribute('aria-label', k); b.onclick = () => turn(k); pad.append(b);
  });
  root.append(pad);
  reset();
  const timer = setInterval(step, 120);
  return () => { clearInterval(timer); document.removeEventListener('keydown', onKey); };
}

/* ---------- Memory Match ---------- */
function memory(root, set) {
  const E = ['🐙','🍋','🚀','🎲','🌵','🎧','🍄','🪁'];
  const deck = [...E, ...E].sort(() => Math.random() - .5);
  const grid = el('div', 'board mem'); root.append(grid);
  let first = null, lock = false, moves = 0, found = 0, best = +store.get('best-memory') || 0;
  const label = () => set('Moves ' + moves + (best ? ' · Best ' + best : ''));
  deck.forEach(sym => {
    const c = el('button', 'cell', '?'); c.setAttribute('aria-label', 'Hidden card');
    c.onclick = () => {
      if (lock || c.classList.contains('up') || c.classList.contains('ok')) return;
      c.textContent = sym; c.classList.add('up');
      if (!first) { first = c; return; }
      moves++; label();
      if (first.textContent === sym) {
        first.className = c.className = 'cell ok'; first = null; found++;
        if (found === E.length) {
          if (!best || moves < best) { best = moves; store.set('best-memory', best); }
          set('You won in ' + moves + ' moves. Best ' + best + '.');
        }
      } else {
        lock = true; const a = first; first = null;
        setTimeout(() => { a.textContent = c.textContent = '?'; a.classList.remove('up'); c.classList.remove('up'); lock = false; }, 700);
      }
    };
    grid.append(c);
  });
  label();
  return () => {};
}

/* ---------- Tic-Tac-Toe ---------- */
function ttt(root, set) {
  const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win = b => { for (const [a,c,d] of L) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; return b.every(Boolean) ? 'T' : null; };
  const mm = (b, t) => {
    const w = win(b); if (w) return w === 'O' ? 1 : w === 'X' ? -1 : 0;
    let r = t === 'O' ? -2 : 2;
    b.forEach((v, i) => { if (v) return; b[i] = t; const x = mm(b, t === 'O' ? 'X' : 'O'); b[i] = null; r = t === 'O' ? Math.max(r, x) : Math.min(r, x); });
    return r;
  };
  const pick = b => {
    const free = b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (Math.random() < .25) return free[Math.random()*free.length|0];
    let bi = free[0], bs = -3;
    free.forEach(i => { b[i] = 'O'; const x = mm(b, 'X'); b[i] = null; if (x > bs) { bs = x; bi = i; } });
    return bi;
  };
  const grid = el('div', 'board ttt'); root.append(grid);
  const tally = {W:0, L:0, D:0};
  let b, cells;
  const tl = msg => set((msg ? msg + ' · ' : '') + 'Wins ' + tally.W + ' · Losses ' + tally.L + ' · Draws ' + tally.D);
  const end = w => {
    cells.forEach(c => c.disabled = true);
    if (w === 'X') { tally.W++; tl('You win!'); } else if (w === 'O') { tally.L++; tl('Computer wins.'); } else { tally.D++; tl('Draw.'); }
    const again = el('button', 'btn', 'Play again'); again.onclick = () => { again.remove(); reset(); }; root.append(again);
  };
  const reset = () => {
    b = Array(9).fill(null); grid.innerHTML = ''; cells = [];
    for (let i = 0; i < 9; i++) {
      const c = el('button', 'cell'); c.setAttribute('aria-label', 'Square ' + (i + 1));
      c.onclick = () => {
        if (b[i]) return;
        b[i] = 'X'; c.textContent = 'X'; c.classList.add('x'); c.disabled = true;
        let w = win(b); if (w) return end(w);
        const j = pick(b); b[j] = 'O'; cells[j].textContent = 'O'; cells[j].classList.add('o'); cells[j].disabled = true;
        w = win(b); if (w) end(w);
      };
      cells.push(c); grid.append(c);
    }
    tl('');
  };
  reset();
  return () => {};
}

/* ---------- 2048 ---------- */
function g2048(root, set) {
  const grid = el('div', 'board g2048'); root.append(grid);
  let g = Array(16).fill(0), score = 0, over = false, best = +store.get('best-2048') || 0;
  const add = () => { const e = g.map((v, i) => v ? -1 : i).filter(i => i >= 0); if (e.length) g[e[Math.random()*e.length|0]] = Math.random() < .9 ? 2 : 4; };
  const tiles = Array.from({length: 16}, () => { const t = el('div', 'cell'); grid.append(t); return t; });
  const render = () => {
    g.forEach((v, i) => {
      tiles[i].textContent = v || '';
      tiles[i].style.background = v ? 'hsl(' + ((Math.log2(v) * 38 + 200) % 360) + ' 85% 65%)' : '';
      tiles[i].style.fontSize = v > 999 ? '1.1rem' : v > 99 ? '1.3rem' : '';
    });
    best = Math.max(best, score); store.set('best-2048', best);
    set('Score ' + score + ' · Best ' + best + (over ? ' · No moves left. Press R or Restart.' : ''));
  };
  const idx = (dir, i) => [0,1,2,3].map(k => dir === 'l' ? i*4 + k : dir === 'r' ? i*4 + 3 - k : dir === 'u' ? k*4 + i : (3 - k)*4 + i);
  const slide = line => {
    const a = line.filter(Boolean);
    for (let i = 0; i < a.length - 1; i++) if (a[i] === a[i+1]) { a[i] *= 2; score += a[i]; a.splice(i + 1, 1); }
    while (a.length < 4) a.push(0);
    return a;
  };
  const stuck = () => !g.includes(0) && !g.some((v, i) => (i % 4 < 3 && v === g[i+1]) || (i < 12 && v === g[i+4]));
  const move = dir => {
    if (over) return;
    let moved = false;
    for (let i = 0; i < 4; i++) {
      const ix = idx(dir, i), n = slide(ix.map(j => g[j]));
      ix.forEach((j, k) => { if (g[j] !== n[k]) { moved = true; g[j] = n[k]; } });
    }
    if (moved) { add(); over = stuck(); }
    render();
  };
  const restart = () => { g.fill(0); score = 0; over = false; add(); add(); render(); };
  const keys = {ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r', w:'u', s:'d', a:'l', d:'r'};
  const onKey = e => {
    if (e.key === 'r') return restart();
    if (keys[e.key]) { move(keys[e.key]); e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  swipe(grid, move);
  const rb = el('button', 'btn', 'Restart'); rb.onclick = restart; root.append(rb);
  restart();
  return () => document.removeEventListener('keydown', onKey);
}

/* ---------- Folded Halls (impossible-rooms maze) ---------- */
function halls(root, set) {
  const MAP = [
    '##################',
    '#11111#######5E5##',
    '#11L11#######555##',
    '#11111a######555##',
    '#11111#######555##',
    '##################',
    '########L#########',
    '#22222222222222d##',
    '############3#####',
    '########b3333#####',
    '##################'];
  // portal cell -> [target x, target y, quarter turns]
  const PORTALS = {'6,3':[12,8,3], '15,7':[3,7,0], '8,9':[14,3,1]};
  const solid = (x, y) => { const c = (MAP[y] || '')[x]; return !c || '#EL'.includes(c); };
  const rot = (x, y, k) => { for (let i = 0; i < k; i++) { const t = x; x = -y; y = t; } return [x, y]; };
  const hsl = (h, s, l) => { s /= 100; l /= 100; const a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255 | 0; }; return [f(0), f(8), f(4)]; };
  const HUES = {'1':210, '2':285, '3':35, '4':150, '5':50, '.':260};
  const PAL = {};
  for (const c in HUES) { const h = HUES[c]; PAL[c] = {w:hsl(h,55,36), w2:hsl(h,55,28), wl:hsl(h,95,68), fl:hsl(h,50,15), fll:hsl(h,95,58), cl:hsl(h,50,9), cll:hsl(h,80,40)}; }
  const pal = c => PAL[c] || PAL['.'];
  const FOG = [16, 14, 36], VW = 400, VH = 250, K = Math.tan(.55), FOC = VW / (2 * K);
  const pack = (r, g, b) => 0xff000000 | (Math.min(255, b) << 16) | (Math.min(255, g) << 8) | Math.min(255, r);
  const fg = (c, f) => pack(FOG[0] + (c[0] - FOG[0]) * f, FOG[1] + (c[1] - FOG[1]) * f, FOG[2] + (c[2] - FOG[2]) * f);
  const cv = el('canvas'); cv.width = VW; cv.height = VH; cv.style.width = 'min(100%,800px)'; root.append(cv);
  const ctx = cv.getContext('2d'), img = ctx.createImageData(VW, VH), buf = new Uint32Array(img.data.buffer);
  const keys = {};
  let px, py, pa, t0, won, raf, lastSec = -1, tm = 0, ac;
  const reset = () => { px = 1.5; py = 3.5; pa = 0; t0 = performance.now(); won = false; lastSec = -1; };

  function cast(ang) {
    let x = px, y = py, dx = Math.cos(ang), dy = Math.sin(ang), total = 0;
    const segs = [{x, y, dx, dy, t0: 0}];
    for (let hop = 0; hop < 10; hop++) {
      let mx = Math.floor(x), my = Math.floor(y), pmx = mx, pmy = my;
      const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
      const sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
      let sdx = (dx < 0 ? x - mx : mx + 1 - x) * ddx, sdy = (dy < 0 ? y - my : my + 1 - y) * ddy;
      let side = 0, tt = 0, portal = null;
      for (let i = 0; i < 40; i++) {
        pmx = mx; pmy = my;
        if (sdx < sdy) { tt = sdx; sdx += ddx; mx += sx; side = 0; } else { tt = sdy; sdy += ddy; my += sy; side = 1; }
        portal = PORTALS[mx + ',' + my];
        if (portal) break;
        if (solid(mx, my)) {
          const hx = x + dx * tt, hy = y + dy * tt, w = side === 0 ? hy : hx;
          return {d: total + tt, mx, my, side, u: w - Math.floor(w), zone: (MAP[pmy] || '')[pmx], segs};
        }
      }
      if (!portal) break;
      const [lx, ly] = rot(x + dx * tt - mx - .5, y + dy * tt - my - .5, portal[2]);
      [dx, dy] = rot(dx, dy, portal[2]);
      x = portal[0] + .5 + lx + dx * 1e-4; y = portal[1] + .5 + ly + dy * 1e-4;
      total += tt;
      segs.push({x, y, dx, dy, t0: total});
    }
    return {d: 99, mx: 0, my: 0, side: 0, u: 0, zone: '.', segs};
  }

  function flat(segs, rd, ceil) {
    let s = segs[0];
    for (let k = 1; k < segs.length && segs[k].t0 <= rd; k++) s = segs[k];
    const x = s.x + s.dx * (rd - s.t0), y = s.y + s.dy * (rd - s.t0), cx = Math.floor(x), cy = Math.floor(y), p = pal((MAP[cy] || '')[cx]);
    const gx = x - cx, gy = y - cy, e = Math.min(gx, 1 - gx, gy, 1 - gy);
    let c, k;
    if (e < .03 + rd * .004) { c = ceil ? p.cll : p.fll; k = .8 + .3 * Math.sin(tm * 2.5 - rd * .7); }
    else { c = ceil ? p.cl : p.fl; k = (cx + cy) & 1 ? 1.35 : 1; }
    let f = Math.max(0, 1 - rd / 14); f *= f;
    return pack(FOG[0] + (c[0] * k - FOG[0]) * f, FOG[1] + (c[1] * k - FOG[1]) * f, FOG[2] + (c[2] * k - FOG[2]) * f);
  }

  function draw() {
    for (let i = 0; i < VW; i++) {
      const a = pa + Math.atan((i / VW - .5) * 2 * K), ca = Math.cos(a - pa), h = cast(a);
      const dp = Math.max(.05, h.d * ca), lh = FOC / dp, top = VH / 2 - lh / 2, bot = top + lh;
      const y0 = Math.max(0, Math.ceil(top)), y1 = Math.min(VH, Math.floor(bot));
      const ch = MAP[h.my][h.mx], p = pal(h.zone);
      let A = p.w, B = p.w2, L = p.wl;
      if (ch === 'L') { A = [205, 235, 255]; B = [120, 170, 215]; L = [255, 255, 255]; }
      else if (ch === 'E') { const q = .75 + .25 * Math.sin(tm * 4); A = [255 * q, 190 * q, 60 * q]; B = [200 * q, 140 * q, 40 * q]; L = [255, 245, 180]; }
      let f = Math.max(0, 1 - dp / 14); f = f * f * (h.side ? .78 : 1);
      const pA = fg(A, f), pB = fg(B, f), pL = fg(L, f), thr = .045 + dp * .004;
      for (let y = 0; y < y0; y++) buf[y * VW + i] = flat(h.segs, FOC * .5 / (VH / 2 - y - .5) / ca, true);
      for (let y = y0; y < y1; y++) {
        const v = (y - top) / lh;
        let c;
        if (ch === 'L') c = ((h.u * 8) | 0) & 1 ? pA : pB;
        else {
          const gu = (h.u * 3) % 1, gv = (v * 3) % 1;
          c = Math.min(gu, 1 - gu, gv, 1 - gv) < thr ? pL : (((h.u * 3) | 0) + ((v * 3) | 0)) & 1 ? pB : pA;
        }
        buf[y * VW + i] = c;
      }
      for (let y = y1; y < VH; y++) buf[y * VW + i] = flat(h.segs, FOC * .5 / (y + .5 - VH / 2) / ca, false);
    }
    ctx.putImageData(img, 0, 0);
  }

  function tick(dt, ts) {
    const sp = 2.4 * dt;
    if (keys.ArrowLeft) pa -= 2.1 * dt;
    if (keys.ArrowRight) pa += 2.1 * dt;
    const f = (keys.w || keys.ArrowUp ? 1 : 0) - (keys.s || keys.ArrowDown ? 1 : 0), st = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    const nx = px + (Math.cos(pa) * f - Math.sin(pa) * st) * sp, ny = py + (Math.sin(pa) * f + Math.cos(pa) * st) * sp, r = .18;
    const free = (x, y) => !(solid(Math.floor(x - r), Math.floor(y - r)) || solid(Math.floor(x + r), Math.floor(y - r)) || solid(Math.floor(x - r), Math.floor(y + r)) || solid(Math.floor(x + r), Math.floor(y + r)));
    const stuck = !free(px, py), ok = (x, y) => free(x, y) || (stuck && !solid(Math.floor(x), Math.floor(y)));
    if (ok(nx, py)) px = nx;
    if (ok(px, ny)) py = ny;
    const p = PORTALS[Math.floor(px) + ',' + Math.floor(py)];
    if (p) { const [lx, ly] = rot(px % 1 - .5, py % 1 - .5, p[2]); px = p[0] + .5 + lx; py = p[1] + .5 + ly; pa += p[2] * Math.PI / 2; }
    const sec = Math.floor((ts - t0) / 1000);
    if (Math.hypot(px - 14.5, py - 1.5) < 1.1) {
      won = true; document.exitPointerLock && document.exitPointerLock();
      set('You found it in ' + sec + 's. Press R to play again.');
    } else if (sec !== lastSec) { lastSec = sec; set('Time ' + sec + 's · find the glowing cell'); }
  }

  const hum = () => {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const g = ac.createGain(); g.gain.value = .035; g.connect(ac.destination);
      [55, 82.5, 110.4].forEach(fr => { const o = ac.createOscillator(); o.frequency.value = fr; o.connect(g); o.start(); });
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = .15; lg.gain.value = .02; l.connect(lg); lg.connect(g.gain); l.start();
    } catch (e) {}
  };
  let last = performance.now();
  const frame = ts => {
    const dt = Math.min(.05, (ts - last) / 1000); last = ts; tm = ts / 1000;
    if (!won) tick(dt, ts);
    draw();
    raf = requestAnimationFrame(frame);
  };
  const norm = e => e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const down = e => { const k = norm(e); if (k === 'r') reset(); if (k.startsWith('Arrow') || k === ' ') e.preventDefault(); keys[k] = true; hum(); };
  const up = e => { keys[norm(e)] = false; };
  const mouse = e => { if (document.pointerLockElement === cv) pa += e.movementX * .003; };
  cv.addEventListener('click', () => { hum(); if (!won && cv.requestPointerLock) cv.requestPointerLock(); });
  document.addEventListener('keydown', down); document.addEventListener('keyup', up); document.addEventListener('mousemove', mouse);
  halls.dbg = () => ({px, py, pa, won});
  reset();
  raf = requestAnimationFrame(frame);
  return () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', down); document.removeEventListener('keyup', up); document.removeEventListener('mousemove', mouse);
    document.exitPointerLock && document.exitPointerLock();
    if (ac) ac.close();
  };
}

/* ---------- Hub ---------- */
const GAMES = {
  snake:  {name:'Snake',        ico:'🐍', color:'#4ff0b0', blurb:'Eat, grow, don’t crash.',        hint:'Arrow keys or WASD on a keyboard. Swipe or use the buttons on a phone.', run:snake},
  memory: {name:'Memory Match', ico:'🧠', color:'#ffcf5c', blurb:'Find all eight pairs.',          hint:'Flip two cards at a time. Fewer moves is better.', run:memory},
  ttt:    {name:'Tic-Tac-Toe',  ico:'❌', color:'#ff6fb1', blurb:'You are X. Beat the computer.',  hint:'The computer is good, but it makes a mistake now and then.', run:ttt},
  halls:  {name:'Folded Halls', ico:'🌀', color:'#c58bff', blurb:'A maze that doesn’t add up.', hint:'WASD to move, arrow keys or mouse to look (click the view first). Find the glowing gold cell. Press R to restart.', run:halls},
  g2048:  {name:'2048',         ico:'🔢', color:'#7aa2ff', blurb:'Merge tiles to reach 2048.',     hint:'Arrow keys or WASD, or swipe. Press R to restart.', run:g2048}
};
const bestKey = {snake:'best-snake', memory:'best-memory', g2048:'best-2048'};
const grid = $('#grid');
Object.entries(GAMES).forEach(([id, g]) => {
  const t = el('button', 'tile'); t.style.setProperty('--a', g.color);
  t.append(el('div', 'ico', g.ico), el('h2', '', g.name), el('p', '', g.blurb));
  t.onclick = () => { location.hash = id; };
  grid.append(t);
});
let stop = null;
function route() {
  if (stop) { stop(); stop = null; }
  const id = location.hash.slice(1), g = GAMES[id];
  $('#hub').style.display = g ? 'none' : 'block';
  $('#stage').style.display = g ? 'block' : 'none';
  $('#play').innerHTML = '';
  if (!g) { document.title = 'Pocket Arcade'; return; }
  document.title = g.name + ' · Pocket Arcade';
  $('#gname').textContent = g.name;
  $('#stage').style.setProperty('--a', g.color);
  $('#ghint').textContent = g.hint;
  stop = g.run($('#play'), txt => { $('#score').textContent = txt; });
}
$('#back').onclick = () => { location.hash = ''; };
window.addEventListener('hashchange', route);
route();
</script>
